<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Father's Day</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
height:100vh;

background: url("images/IMG-20250727-WA0006.jpeg");
    
background:
linear-gradient(
rgba(0,0,0,0.70),
rgba(0,0,0,0.85)
),
url("images/father.jpg");

background-size:cover;
background-position:center;

display:flex;
justify-content:center;
align-items:center;

font-family:'Cormorant Garamond', serif;
color:white;
}

.container{

text-align:center;

padding:50px;

border:1px solid rgba(212,175,55,.4);

background:rgba(0,0,0,.25);

backdrop-filter:blur(4px);

width:90%;
max-width:800px;

}

.subtitle{

letter-spacing:8px;

font-size:18px;

color:#d4af37;

margin-bottom:10px;

}

h1{

font-size:72px;

color:#d4af37;

font-weight:700;

margin-bottom:20px;

}

.line{

width:180px;

height:1px;

background:#d4af37;

margin:auto;

margin-bottom:30px;

}

.message{

font-size:26px;

line-height:1.8;

color:#f2f2f2;

}

.signature{

margin-top:40px;

font-size:22px;

color:#d4af37;

font-style:italic;

}

</style>
</head>

<body>

<div class="container">

<div class="subtitle">
FOR THE BEST FATHER
</div>

<h1>Happy Father’s Day</h1>

<div class="line"></div>

<div class="message">

Thank you for your guidance,
your strength,
and for always standing beside us.

</div>

<div class="signature">

With love ❤️

</div>

</div>

</body>
</html>
