<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Father's Day</title>
    <style>
        /* Classic, Professional, Clean Black Theme */
        
        :root {
            --bg-color: #0d1117; /* GitHub-style deep black */
            --card-bg: #161b22; /* Slightly lighter black for depth */
            --text-color: #c9d1d9; /* Off-white for readability */
            --accent-gold: #c6a059; /* Classic, professional gold accent */
            --shadow: 0 8px 24px rgba(0,0,0,0.5);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Keeps background still */
        }

        /* background-image setup:
           Assumes your photo is saved as 'father.jpg' in the same folder.
        */
        .background-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('father.jpg'); 
            background-size: cover;
            background-position: center;
            filter: grayscale(100%) brightness(20%) contrast(120%); /* Classic black aesthetic */
            opacity: 0.4; /* Subtle backdrop, doesn't overpowering text */
            z-index: -1;
        }

        .main-card {
            background-color: var(--card-bg);
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05); /* Very subtle border */
            max-width: 90%;
            width: 500px;
            position: relative;
            z-index: 1;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 2.8rem;
            margin: 0 0 10px 0;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        h2 {
            font-size: 1.2rem;
            font-weight: 400;
            color: var(--text-color);
            margin: 0 0 30px 0;
            opacity: 0.8;
        }

        .divider {
            width: 60px;
            height: 2px;
            background-color: var(--accent-gold);
            margin: 0 auto 30px auto;
        }

        .code-block {
            background-color: rgba(0,0,0,0.3);
            font-family: 'Courier New', Courier, monospace;
            padding: 20px;
            border-radius: 6px;
            font-size: 0.9rem;
            line-height: 1.5;
            color: #8b949e; /* Subtle code color */
            text-align: left;
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .code-key { color: var(--accent-gold); }
        .code-string { color: #a5d6ff; }
        .code-comment { color: #8b949e; font-style: italic;}

        .action-button {
            display: inline-block;
            background-color: transparent;
            color: var(--accent-gold);
            border: 1px solid var(--accent-gold);
            padding: 12px 24px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, color 0.2s;
        }

        .action-button:hover {
            background-color: var(--accent-gold);
            color: var(--card-bg);
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .main-card { padding: 30px; }
            h1 { font-size: 2.2rem; }
            h2 { font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="background-overlay"></div>

    <div class="main-card">
        <h1>Happy Father's Day</h1>
        <h2>A classic tribute to the man in black.</h2>
        <div class="divider"></div>

        <div class="code-block">
            <span class="code-comment">// Committing this one to the main branch...</span><br>
            <span class="code-key">const</span> <span class="code-text">father</span> = {<br>
            &nbsp;&nbsp;<span class="code-key">name</span>: <span class="code-string">"Dad"</span>,<br>
            &nbsp;&nbsp;<span class="code-key">favoriteColor</span>: <span class="code-string">"Black"</span>,<br>
            &nbsp;&nbsp;<span class="code-key">status</span>: <span class="code-string">"Professional & Classic"</span>,<br>
            &nbsp;&nbsp;<span class="code-key">message</span>: <span class="code-string">"You're the best. Love you."</span><br>
            };<br><br>
            console.log(father.message);
        </div>

        <a href="https://github.com" class="action-button">View on GitHub</a>
    </div>

</body>
</html>
