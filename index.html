<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Father's Day</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{

height:100vh;

background:
linear-gradient(
rgba(0,0,0,0.72),
rgba(0,0,0,0.85)
),

url("images/IMG-20250727-WA0006.jpeg");

background-size:cover;
background-position:center;
background-repeat:no-repeat;

display:flex;

justify-content:center;

align-items:center;

font-family:'Cormorant Garamond', serif;

color:white;

overflow:hidden;

}

.container{

width:90%;
max-width:850px;

text-align:center;

padding:60px;

background:rgba(0,0,0,0.28);

border:1px solid rgba(212,175,55,.4);

backdrop-filter:blur(5px);

}

.subtitle{

font-size:18px;

letter-spacing:8px;

color:#d4af37;

margin-bottom:18px;

}

h1{

font-size:72px;

font-weight:700;

color:#d4af37;

margin-bottom:25px;

}

.line{

width:200px;

height:1px;

background:#d4af37;

margin:auto;

margin-bottom:35px;

}

.message{

font-size:28px;

line-height:1.8;

color:#f5f5f5;

}

.signature{

margin-top:45px;

font-size:24px;

color:#d4af37;

font-style:italic;

}

@media(max-width:768px){

h1{
font-size:50px;
}

.message{
font-size:22px;
}

.container{
padding:40px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="subtitle">
FOR THE MAN WHO INSPIRES US
</div>

<h1>Happy Father’s Day</h1>

<div class="line"></div>

<div class="message">

Thank you for your strength, guidance, and endless support.  
Your wisdom and love shape every step we take.

</div>

<div class="signature">

With Love ❤️

</div>

</div>

</body>
</html>
